[package]
name = "tabby"
version = "1.2.0"
description = "Tabby: sticky notes ancorate al bordo dello schermo"
authors = ["Roberto Pisco Pisconti"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tabby_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-winrt-notification = "0.8.1"
chrono = "0.4.45"
tauri-plugin-clipboard-manager = "2.4.0"
tauri-plugin-dialog = "2.8.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
# Google Calendar integration
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls-native-roots", "system-proxy"], default-features = false }
open    = "5"
sha2    = "0.10"
base64  = "0.22"
rand    = "0.9"
serde_urlencoded = "0.7"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Il linker MSVC stampa "Creazione della libreria ... .dll.lib": innocuo, lo silenziamo.
[lints.rust]
linker_messages = "allow"
